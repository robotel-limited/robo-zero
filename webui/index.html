<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>robo-zero</title>
  <link rel="icon" type="image/png" href="/static/favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Josefin+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/css/messages.css" />
  <link rel="stylesheet" href="/static/css/project_memory.css" />
</head>
<body>
  <button id="toggle-main-btn" title="Show/hide right panel">☰</button>
  <button id="toggle-sidebar-btn" title="Show/hide left panel">☰</button>
  <div id="app">
    <aside id="sidebar">
      <div class="zigzag"></div>
      <a href="https://robotel-limited.co.uk" target="_blank" rel="noopener" title="Robotel Limited UK">
        <img id="brand-logo" src="/static/robotel-logo.png" alt="Robotel" />
      </a>
      <button id="new-chat-btn">+ New chat</button>
      <div id="chat-list"></div>
      <a id="projects-btn" href="/projects" title="Projects">📁 Projects</a>
      <a id="settings-btn" href="/settings" title="Settings">⚙ Settings</a>
      <div id="token-count" title="Estimated tokens in conversation">
        <span id="rate-dot" class="rate-dot"></span>
        <span id="token-count-text">0 tokens</span>
      </div>
      <div id="sidebar-footer">
        Powered by <a href="https://robotel-limited.co.uk" target="_blank" rel="noopener">Robotel Limited UK</a>
      </div>
    </aside>
    <main id="main">
      <div id="messages"></div>
      <div id="approval-bar" class="hidden">
        <div id="approval-text"></div>
        <div class="approval-actions">
          <button id="approve-yes">Approve</button>
          <button id="approve-no">Reject</button>
        </div>
      </div>
      <div id="compose-attachments"></div>
      <form id="compose-form">
        <input id="attach-image-input" type="file" accept="image/*" multiple style="display: none" />
        <button id="attach-image-btn" type="button" title="Attach an image">📎</button>
        <textarea id="compose-input" placeholder="Write a message… (you can paste a screenshot)" rows="2"></textarea>
        <button id="cancel-btn" type="button" class="hidden">Cancel</button>
        <button id="send-btn" type="submit">Send</button>
      </form>
    </main>
  </div>
  <script src="/static/notify.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
